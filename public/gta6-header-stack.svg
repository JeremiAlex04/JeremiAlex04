<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 74" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0718" stop-opacity="0"/>
      <stop offset="15%" stop-color="#140924" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#140924" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0718" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#ff9e44"/>
      <stop offset="80%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textSunset" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffe4f2"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="6" width="920" height="62" fill="url(#bgGrad)"/>

  <!-- Top and bottom neon accent lines -->
  <rect x="40" y="6" width="840" height="2" fill="url(#neonLine)" filter="url(#glow)"/>
  <rect x="110" y="66" width="700" height="1.5" fill="url(#neonLine)" opacity="0.7"/>

  <!-- Geometric Vice City corner brackets -->
  <path d="M 65 18 L 50 18 L 50 56 L 65 56" fill="none" stroke="#ff2a85" stroke-width="2" opacity="0.85"/>
  <path d="M 855 18 L 870 18 L 870 56 L 855 56" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.85"/>

  <!-- Subtle vector chevron markers -->
  <polygon points="82,37 92,31 92,43" fill="#ff2a85" opacity="0.8"/>
  <polygon points="838,37 828,31 828,43" fill="#00f0ff" opacity="0.8"/>

  <!-- Kicker -->
  <text x="460" y="26" text-anchor="middle" font-family="'Segoe UI', 'Montserrat', 'Arial', sans-serif" font-size="10.5" font-weight="700" letter-spacing="4.5" fill="#ff7b54">VICE CITY LOADOUT // TECHNOLOGIES</text>

  <!-- Main Title -->
  <text x="460" y="54" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Franklin Gothic Heavy', sans-serif" font-size="25" letter-spacing="3" fill="url(#textSunset)" filter="url(#glow)">ARSENAL &amp; TECH STACK</text>
</svg>
